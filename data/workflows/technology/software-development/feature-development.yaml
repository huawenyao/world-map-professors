# ========================================
# 流程定义: 功能开发流程
# Workflow: Feature Development
# ========================================

id: wf-tech-sd-feature-dev
name: 功能开发流程
scenario_ref: scn-tech-software-dev

description: |
  从需求分析到代码合并的完整功能开发流程，
  定义了每个步骤的输入输出、所需工具和能力。

# 流程步骤
steps:
  - id: step-01
    name: 需求理解与拆解
    description: 分析需求文档，拆解为可执行的技术任务
    type: assisted
    
    input:
      type: object
      properties:
        requirement_doc:
          type: string
        acceptance_criteria:
          type: array
      required:
        - requirement_doc
    
    output:
      type: object
      properties:
        technical_tasks:
          type: array
        estimated_effort:
          type: string
        dependencies:
          type: array
    
    tools:
      - tool-requirement-analyzer
      - tool-task-manager
    
    capabilities:
      - cap-tech-002
    
    estimated_duration: "30min"
    requires_human_confirmation: true

  - id: step-02
    name: 技术方案设计
    description: 设计技术实现方案，包括架构和接口
    type: assisted
    
    depends_on:
      - step-01
    
    input:
      type: object
      properties:
        technical_tasks:
          type: array
        existing_codebase:
          type: string
    
    output:
      type: object
      properties:
        design_doc:
          type: string
        api_spec:
          type: object
        db_changes:
          type: array
    
    tools:
      - tool-code-analyzer
      - tool-diagram-generator
    
    capabilities:
      - cap-tech-002
      - cap-tech-003
    
    estimated_duration: "1h"
    requires_human_confirmation: true

  - id: step-03
    name: 代码实现
    description: 根据设计方案编写代码
    type: assisted
    
    depends_on:
      - step-02
    
    input:
      type: object
      properties:
        design_doc:
          type: string
        api_spec:
          type: object
    
    output:
      type: object
      properties:
        code_changes:
          type: array
        files_modified:
          type: array
    
    tools:
      - tool-code-generator
      - tool-code-completion
      - tool-linter
    
    capabilities:
      - cap-tech-001
    
    estimated_duration: "4h"
    requires_human_confirmation: false

  - id: step-04
    name: 单元测试编写
    description: 为新代码编写单元测试
    type: automated
    
    depends_on:
      - step-03
    
    input:
      type: object
      properties:
        code_changes:
          type: array
    
    output:
      type: object
      properties:
        test_files:
          type: array
        coverage_report:
          type: object
    
    tools:
      - tool-test-generator
      - tool-coverage-analyzer
    
    capabilities:
      - cap-tech-004
    
    estimated_duration: "1h"
    requires_human_confirmation: false

  - id: step-05
    name: 代码审查
    description: AI辅助代码审查，检查质量和规范
    type: assisted
    
    depends_on:
      - step-03
      - step-04
    
    input:
      type: object
      properties:
        code_changes:
          type: array
        test_files:
          type: array
    
    output:
      type: object
      properties:
        review_comments:
          type: array
        quality_score:
          type: number
        suggested_fixes:
          type: array
    
    tools:
      - tool-code-reviewer
      - tool-security-scanner
    
    capabilities:
      - cap-tech-001
      - cap-tech-005
    
    estimated_duration: "30min"
    requires_human_confirmation: true

  - id: step-06
    name: 合并与部署
    description: 合并代码并触发CI/CD流水线
    type: automated
    
    depends_on:
      - step-05
    
    output:
      type: object
      properties:
        merge_status:
          type: string
        pipeline_url:
          type: string
        deployment_status:
          type: string
    
    tools:
      - tool-git-operations
      - tool-ci-cd
    
    capabilities:
      - cap-tech-006
    
    estimated_duration: "15min"
    requires_human_confirmation: false

# 入口条件
entry_conditions:
  - 需求已评审通过
  - 开发分支已创建

# 出口条件
exit_conditions:
  - 代码已合并到主分支
  - CI/CD流水线通过

# 人工检查点
human_checkpoints:
  - step-01
  - step-02
  - step-05

# 流程指标
metrics:
  avg_duration: "6h"
  automation_rate: "50%"
  success_rate: "90%"

plaza:
  asset_class: workflow
  publish_to_plaza: true
  featured_on_plaza: true


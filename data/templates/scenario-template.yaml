# ========================================
# 业务场景模板文件
# Business Scenario Template
# ========================================
#
# 使用说明:
# 1. 复制此模板文件到 data/taxonomy/scenarios/{industry}/ 目录
# 2. 将文件重命名为 {scenario-id}.yaml
# 3. 填写所有必填字段 (标记为 REQUIRED)
# 4. 根据需要填写可选字段
# 5. 运行验证命令: world-professors validate scenario {file-path}

# ========================================
# 基本信息 (REQUIRED)
# ========================================

# 场景唯一标识符 (格式: {industry}-{scenario}-{num}, 如: tech-saas-product-001)
id: "tech-saas-product-001"

# 场景名称 (最多200字符)
name: "SaaS产品研发与交付"

# 场景详细描述 (支持多行)
description: |
  面向B端企业客户的SaaS产品研发全流程,包括需求分析、产品设计、
  技术开发、测试部署、运维支持等环节。

# 所属行业 (REQUIRED)
industry: "软件与信息技术服务"

# 所属子行业 (可选)
sub_industry: "企业级SaaS"

# ========================================
# 元数据 (自动生成或手动指定)
# ========================================
metadata:
  created_at: "2025-01-20T10:00:00"
  updated_at: "2025-01-20T10:00:00"
  author: "数字角色研究组"
  version: "1.0"
  schema_version: "1.0"

# ========================================
# 搜索标签 (可选,建议填写)
# ========================================
tags:
  - "产品研发"
  - "敏捷开发"
  - "B端SaaS"
  - "DevOps"

# ========================================
# 价值流定义 (可选,建议填写)
# ========================================
# 描述业务价值创造的各个阶段及其活动
value_flow:
  - stage: "需求发现"
    activities:
      - "客户访谈与需求收集"
      - "竞品分析与市场调研"
      - "需求优先级评估"

  - stage: "产品设计"
    activities:
      - "产品原型设计"
      - "用户体验优化"
      - "技术方案评审"

  - stage: "工程开发"
    activities:
      - "前后端功能开发"
      - "代码审查与合并"
      - "自动化测试编写"

  - stage: "质量保障"
    activities:
      - "功能测试与性能测试"
      - "安全漏洞扫描"
      - "用户验收测试"

  - stage: "发布上线"
    activities:
      - "灰度发布与监控"
      - "文档更新与培训"
      - "用户反馈收集"

# ========================================
# 关键指标 (可选,建议填写)
# ========================================
# 衡量场景表现的核心KPI
key_metrics:
  - "产品交付周期 (Time to Market)"
  - "需求响应速度 (Lead Time)"
  - "缺陷修复时间 (MTTR)"
  - "客户满意度 (CSAT)"
  - "功能上线成功率"

# ========================================
# 传统痛点 (可选,建议填写)
# ========================================
# 传统模式下的主要挑战和问题
traditional_pain_points:
  - "需求频繁变更,开发计划难以把控"
  - "跨团队协作效率低,信息不对称"
  - "手工测试耗时长,质量不稳定"
  - "文档编写滞后,知识沉淀不足"
  - "重复性工作占用大量时间"

# ========================================
# AI应用机会 (可选,建议填写)
# ========================================
# AI技术可以改进或创新的环节
ai_opportunities:
  - "AI辅助需求分析与PRD生成"
  - "智能代码补全与代码审查"
  - "自动化测试用例生成与执行"
  - "智能文档生成与维护"
  - "运维异常检测与根因分析"

# ========================================
# 关联场景 (可选)
# ========================================
# 相关或上下游场景ID列表
related_scenarios:
  - "tech-saas-customer-success-001"
  - "tech-cloud-devops-001"
  # - "可添加更多关联场景ID"

# ========================================
# 数字角色模板文件
# Digital Role Template
# ========================================
#
# 使用说明:
# 1. 复制此模板文件到 data/roles/by-industry/{industry}/ 目录
# 2. 将文件重命名为 {role-id}.yaml
# 3. 根据角色类型 (type) 选择对应的示例部分
# 4. 填写所有必填字段 (标记为 REQUIRED)
# 5. 运行验证命令: world-professors validate role {file-path}

# ========================================
# 角色类型说明
# ========================================
# - traditional: 传统角色 (无AI增强)
# - ai-enhanced: AI增强角色 (传统角色+AI工具辅助)
# - emerging: 新兴角色 (AI时代催生的新职位)
# - ai-agent: AI代理角色 (主要由AI执行的角色)

# ========================================
# 示例 1: AI增强角色 (ai-enhanced)
# ========================================

id: "ai-product-manager-001"
name: "AI增强型产品经理"
description: |
  利用AI工具辅助需求分析、竞品研究、数据洞察的现代产品经理。
  在传统产品经理职能基础上,通过AI提升效率和决策质量。

type: "ai-enhanced"

# AI增强角色必须指定传统角色 (REQUIRED for ai-enhanced)
traditional_role: "产品经理"

# 关联场景ID (REQUIRED)
scenario_ref: "tech-saas-product-001"

# 元数据
metadata:
  created_at: "2025-01-20T10:00:00"
  updated_at: "2025-01-20T10:00:00"
  author: "数字角色研究组"
  version: "1.0"
  schema_version: "1.0"

# ========================================
# 职责划分 (可选,建议填写)
# ========================================
responsibilities:
  # 核心职责 (AI无法替代)
  core:
    - "产品战略规划与roadmap制定"
    - "关键决策与优先级判断"
    - "跨部门协调与资源争取"
    - "客户关系维护与需求挖掘"

  # 委托给AI的职责
  delegated_to_ai:
    - "竞品功能对比表生成"
    - "用户反馈文本分类与聚类"
    - "数据报表自动化生成"
    - "会议纪要整理与待办事项提取"

  # 人机协作职责
  collaborative:
    - "需求文档撰写 (AI生成初稿+人工精修)"
    - "用户画像分析 (AI数据挖掘+人工洞察)"
    - "原型设计 (AI辅助布局+人工交互优化)"

# ========================================
# 能力要求 (可选,建议填写)
# ========================================
required_capabilities:
  - capability_id: "cap-cognitive-001"  # 需求洞察与分析能力
    level: "advanced"
    priority: "must-have"

  - capability_id: "cap-technical-002"  # 数据分析能力
    level: "intermediate"
    priority: "should-have"

  - capability_id: "cap-interpersonal-003"  # 跨团队协作能力
    level: "advanced"
    priority: "must-have"

  - capability_id: "cap-domain-004"  # AI工具应用能力
    level: "intermediate"
    priority: "must-have"

# ========================================
# AI工具栈 (可选,建议填写)
# ========================================
ai_tools:
  - name: "Claude / GPT-4"
    purpose: "需求分析、PRD生成、竞品研究"
    vendor: ["Anthropic", "OpenAI"]
    cost: "paid"

  - name: "Notion AI"
    purpose: "文档协作与知识管理"
    vendor: ["Notion"]
    cost: "freemium"

  - name: "Tableau / Power BI"
    purpose: "数据可视化与洞察"
    vendor: ["Salesforce", "Microsoft"]
    cost: "paid"

# ========================================
# 典型工作流 (可选,建议填写)
# ========================================
typical_workflow:
  - step: "1. 需求收集与分析"
    human_time: "4 hours"
    ai_time: "1 hour"
    automation_level: "assisted"

  - step: "2. 竞品分析与调研"
    human_time: "8 hours"
    ai_time: "2 hours"
    automation_level: "assisted"

  - step: "3. PRD文档撰写"
    human_time: "6 hours"
    ai_time: "1.5 hours"
    automation_level: "assisted"

  - step: "4. 原型设计与评审"
    human_time: "4 hours"
    ai_time: "2 hours"
    automation_level: "manual"

  - step: "5. 数据分析与决策支持"
    human_time: "3 hours"
    ai_time: "0.5 hour"
    automation_level: "automated"

# ========================================
# 变革影响 (可选,建议填写)
# ========================================
transformation_impact:
  efficiency_gain: "2.5x"
  quality_improvement: "需求准确率提升40%,决策数据支撑增强"

  new_capabilities:
    - "大规模文本数据快速分析"
    - "多维度竞品动态实时监控"
    - "AI驱动的用户洞察挖掘"

  obsolete_skills:
    - "手工制作竞品对比表"
    - "基础数据统计与报表"
    - "会议记录整理"

# ========================================
# 薪资范围 (可选)
# ========================================
salary_range:
  min: 300000
  max: 800000
  currency: "CNY"
  region: "一线城市 (北上广深)"



<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Plaza Store</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="shell">
    <main class="canvas" id="view"></main>
    <nav class="tabbar" aria-label="Plaza Store">
      <button class="tab" data-go="today">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="5" width="16" height="14" rx="2"/><path d="M8 9h8M8 13h5"/></svg>
        今日
      </button>
      <button class="tab" data-go="people">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="9" cy="8" r="3"/><path d="M4 19a5 5 0 0 1 10 0"/><circle cx="17" cy="9" r="2.2"/><path d="M15 19a4.4 4.4 0 0 1 5-4.2"/></svg>
        人
      </button>
      <button class="tab" data-go="orgs">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 20V8l6-3 6 3v12"/><path d="M10 20v-6h4v6M16 11h4v9h-4"/></svg>
        企业
      </button>
      <button class="tab" data-go="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="6"/><path d="m20 20-3.5-3.5"/></svg>
        搜索
      </button>
      <button class="tab" data-go="library">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="5" width="7" height="7" rx="1.5"/><rect x="13" y="5" width="7" height="7" rx="1.5"/><rect x="4" y="14" width="7" height="5" rx="1.5"/><rect x="13" y="14" width="7" height="5" rx="1.5"/></svg>
        资料库
      </button>
    </nav>
  </div>
  <script src="app.js"></script>
</body>
</html>
